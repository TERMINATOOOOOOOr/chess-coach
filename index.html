<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shoh — шахматный тренер</title>
  <meta name="description" content="Играй с ботами, а ИИ-тренер подсказывает ходы, предупреждает об угрозах и объясняет ошибки.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/pieces.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="bg-floor"></div></div>

  <header class="top">
    <a class="brand" href="#" aria-label="Shoh — шахматный тренер">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
        <path d="M20 6v6M17 9h6M13.5 30h13l-1.6-9.5c2.2-1 3.6-3 3.6-5.2 0-3-2.6-5.3-6-5.3-1.3 0-2.5.4-3.5 1-1-.6-2.2-1-3.5-1-3.4 0-6 2.3-6 5.3 0 2.2 1.4 4.2 3.6 5.2L13.5 30z" fill="currentColor"/>
        <rect x="11.5" y="31" width="17" height="3" rx="1.5" fill="currentColor"/>
      </svg>
      <span class="brand-name">Shoh</span>
      <span class="brand-sub">шахматный тренер</span>
    </a>
    <div class="top-actions">
      <button class="btn ghost" id="btn-flip" type="button" title="Перевернуть доску">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v13m0 0-3-3m3 3 3-3M17 20V7m0 0-3 3m3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Перевернуть</span>
      </button>
      <button class="btn" id="btn-new" type="button">Новая партия</button>
    </div>
  </header>

  <main class="layout">
    <section class="play" aria-label="Партия">
      <div class="strip" id="strip-top"></div>
      <div class="board-row">
        <div class="evalbar" id="evalbar" role="img" aria-label="Оценка позиции">
          <div class="evalbar-fill"></div>
          <span class="evalbar-num"></span>
        </div>
        <div class="board-frame"><div id="board" aria-label="Шахматная доска"></div></div>
      </div>
      <div class="strip" id="strip-bottom"></div>
    </section>

    <aside class="side">
      <section class="card coach" aria-label="Тренер">
        <div class="coach-head">
          <div class="coach-avatar" aria-hidden="true">
            <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="var(--amber-deep)"/><path d="M24 9v5M21.5 11.5h5M17 34h14l-1.8-10.4c2.3-1.1 3.8-3.2 3.8-5.6 0-3.2-2.8-5.6-6.3-5.6-1.4 0-2.6.4-3.7 1.1-1.1-.7-2.3-1.1-3.7-1.1-3.5 0-6.3 2.4-6.3 5.6 0 2.4 1.5 4.5 3.8 5.6L17 34z" fill="var(--amber)"/><rect x="15" y="35.5" width="18" height="3.2" rx="1.6" fill="var(--amber)"/></svg>
          </div>
          <div class="coach-title">
            <b>Тренер</b>
            <span class="coach-status" id="coach-status">готов</span>
          </div>
          <div class="coach-eval" id="coach-eval" title="Оценка движка"></div>
        </div>

        <div class="bubble" id="bubble" aria-live="polite">
          <div class="bubble-tag" id="bubble-tag" hidden></div>
          <p class="bubble-text" id="bubble-text">Выбери соперника, и начнём.</p>
          <p class="bubble-chance" id="bubble-chance" hidden></p>
          <p class="bubble-warn" id="bubble-warn" hidden></p>
          <button class="btn small danger-soft" id="btn-retry" type="button" hidden>Взять назад и попробовать снова</button>
        </div>

        <div class="coach-actions">
          <button class="btn primary" id="btn-hint" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 3h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Подсказка</span>
            <span class="pips" id="hint-pips" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <button class="btn" id="btn-undo" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Ход назад</span>
          </button>
        </div>

        <div class="toggles">
          <label class="switch"><input type="checkbox" id="tg-top"><span class="track"></span><span>Показывать лучшие ходы</span></label>
          <label class="switch"><input type="checkbox" id="tg-threat" checked><span class="track"></span><span>Предупреждать об угрозах</span></label>
          <label class="switch"><input type="checkbox" id="tg-comment" checked><span class="track"></span><span>Разбирать каждый мой ход</span></label>
        </div>

        <ol class="topmoves" id="topmoves" hidden></ol>
      </section>

      <section class="card moves" aria-label="Ходы партии">
        <div class="card-head">
          <b>Ходы</b>
          <span class="acc-live" id="acc-live"></span>
        </div>
        <ol class="movelist" id="movelist"></ol>
        <div class="moves-foot">
          <button class="btn small ghost" id="btn-resign" type="button">Сдаться</button>
        </div>
      </section>
    </aside>
  </main>

  <dialog class="modal setup" id="setup" aria-labelledby="setup-title">
    <form method="dialog" id="setup-form">
      <p class="eyebrow">Новая партия</p>
      <h2 id="setup-title">С кем сыграем?</h2>
      <div class="bots" id="bots" role="radiogroup" aria-label="Соперник"></div>
      <div class="setup-row">
        <fieldset class="seg" aria-label="Цвет фигур">
          <legend>Играю</legend>
          <label><input type="radio" name="color" value="w" checked><span>белыми</span></label>
          <label><input type="radio" name="color" value="r"><span>случайно</span></label>
          <label><input type="radio" name="color" value="b"><span>чёрными</span></label>
        </fieldset>
        <div class="setup-go">
          <button class="btn ghost" value="cancel" id="setup-cancel" type="submit">Отмена</button>
          <button class="btn primary big" value="start" type="submit" autofocus>Начать партию</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog class="modal result" id="result" aria-labelledby="result-title">
    <form method="dialog">
      <p class="eyebrow" id="result-reason"></p>
      <h2 id="result-title"></h2>
      <div class="result-acc">
        <div class="acc-ring" id="acc-ring"><span id="acc-num">—</span><small>точность</small></div>
        <ul class="result-counts" id="result-counts"></ul>
      </div>
      <p class="result-note" id="result-note"></p>
      <div class="result-actions">
        <button class="btn ghost" value="close" type="submit">Посмотреть доску</button>
        <button class="btn" value="other" type="submit">Другой соперник</button>
        <button class="btn primary" value="rematch" type="submit">Реванш</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
